name = "openstrap-reports"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Custom domain: reports.openstrap.wtf (attach in the dashboard or uncomment).
# routes = [{ pattern = "reports.openstrap.wtf", custom_domain = true }]

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "openstrap-reports"

[[d1_databases]]
binding = "DB"
database_name = "openstrap-reports"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]   # daily 03:17 UTC cleanup

# Secrets (wrangler secret put): ADMIN_TOKEN (required); GITHUB_TOKEN, GITHUB_REPO (optional, e.g. OpenStrap/reports)
